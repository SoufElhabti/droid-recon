plugins {
    id 'com.android.application'
}

android {
    namespace 'org.droidrecon.companion'
    compileSdk 36

    defaultConfig {
        applicationId 'org.droidrecon.companion'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
